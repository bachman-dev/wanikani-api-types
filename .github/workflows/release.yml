name: Release
on:
  release:
    types: [published]
jobs:
  test:
    name: "Publish Release"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Install Dependencies
        run: pnpm install
      - name: Lint Code
        run: pnpm lint
      - name: Run Unit Tests
        run: pnpm test
      - name: Build Documentation
        run: pnpm build:docs
      - name: Build Library
        run: pnpm build
      - name: Publish Library (Prerelease)
        if: ${{ github.event.release.prerelease }}
        run: pnpm publish --tag=next --access=public --recursive --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Publish Library (Latest)
        if: ${{ !github.event.release.prerelease }}
        run: pnpm publish --access=public --recursive --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Publish Documentation
        run: "curl -X POST ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"

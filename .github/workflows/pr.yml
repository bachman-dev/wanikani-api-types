name: Tests (PR)
on:
  merge_group:
  pull_request:
    branches:
      - main
      - v3
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
jobs:
  current:
    name: "Build (Current TypeScript devDependency)"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Build Packages
        run: pnpm build
      - name: Lint Code
        run: pnpm lint
      - name: Run Unit Tests
        run: pnpm test
      - name: Upload Coverage Reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  past-ts-versions:
    name: "Build (TypeScript ${{ matrix.typescript-version }})"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    needs: current
    strategy:
      fail-fast: false
      matrix:
        typescript-version: ["7.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: 'pnpm add --save-dev typescript@"~${{ matrix.typescript-version }}"'
      - name: Build Packages
        run: pnpm build
  gate:
    name: "All PR Checks Passed"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    needs: [current, past-ts-versions]
    steps:
      - run: exit 0
